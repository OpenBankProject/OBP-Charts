replicaCount: 1
image: docker.io/openbankproject/obp-api-dispatch:latest
javaOptions: "-Drun.mode=production"
memoryLimit: 1Gi
cpuLimit: 4
memoryRequest: 0.5Gi
cpuRequest: 0.5
app:
  dispatch_host: "api-dispatcher.obp.svc.cluster.local"
  dispatch_port: 80
  obp_api_1_base_uri: "https://api.openbankproject.com"
  logbackXml: |-
    <configuration>
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss} %t %c{0} [%p] %m%n</pattern>
        </encoder>
      </appender>
      <root level="INFO">
        <appender-ref ref="STDOUT"/>
      </root>
    </configuration>


